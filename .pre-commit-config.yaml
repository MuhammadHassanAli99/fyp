# Light local git checks — secrets + basic hygiene only.
# Heavy language/Flutter/platform checks run in CI (basic-checks.yml), not on every commit.
# Install: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=5120"]
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: '\.(lock|xcconfig|pbxproj)$'
      - id: trailing-whitespace
        exclude: '\.(lock|xcconfig|pbxproj)$'

  - repo: local
    hooks:
      - id: block-secrets
        name: Block secret files
        entry: bash scripts/ci/block-secrets.sh
        language: system
        pass_filenames: false
