# Local git check: only block gitignored paths and env files.
# Everything else (source, Podfile.lock, pbxproj, etc.) can be committed.
# Heavy checks run in CI (.github/workflows/basic-checks.yml).
# Install: pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: block-ignored-and-env
        name: Block gitignored and env files
        entry: bash scripts/ci/block-secrets.sh
        language: system
        pass_filenames: false
