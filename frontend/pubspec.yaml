name: frontend
description: "AURELIA marketplace Flutter client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State & routing
  go_router: ^16.0.0
  signals: ^7.0.0
  signals_flutter: ^7.0.0

  # Networking & realtime
  dio: ^5.8.0
  socket_io_client: ^3.1.2
  connectivity_plus: ^6.1.0

  # Persistence
  drift: ^2.26.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.0
  flutter_secure_storage: ^9.2.4
  sqlite3_flutter_libs: ^0.5.32

  # UI & media
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  fl_chart: ^1.0.0
  video_player: ^2.9.5
  audioplayers: ^6.4.0
  image_picker: ^1.1.2
  desktop_drop: ^0.5.0
  file_selector: ^1.0.3
  mime: ^2.0.0

  # Maps & location
  flutter_map: ^8.1.0
  latlong2: ^0.9.1
  geolocator: ^14.0.0

  # Device & platform
  device_info_plus: ^11.3.0
  package_info_plus: ^8.3.0
  local_auth: ^2.3.0
  permission_handler: ^12.0.0
  record: ^7.1.1
  share_plus: ^11.0.0
  url_launcher: ^6.3.1

  # Utilities
  collection: ^1.19.1
  intl: ^0.20.2
  timeago: ^3.7.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.26.0

flutter:
  uses-material-design: true
  generate: true
