# Fast gate on every push and pull request.
# Languages: TypeScript, Dart, Kotlin, Java, Swift, Objective-C, C/C++,
# CMake, Gradle, SQL, Ruby, YAML, JSON, XML, Shell, Docker, HTML.
# Platforms: Android, iOS, macOS, Linux, Windows, and Web scaffolds.
name: Basic Checks

on:
  push:
    branches: [main, master, develop, flutter]
  pull_request:
    branches: [main, master, develop, flutter]
  workflow_dispatch:

concurrency:
  group: basic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Repo hygiene & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Make CI scripts executable
        run: chmod +x scripts/ci/*.sh

      - name: Repository hygiene
        run: ./scripts/ci/validate-repo.sh

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz \
            | tar -xz gitleaks

      - name: Gitleaks secret scan
        run: ./gitleaks detect --source . --verbose --redact --config .gitleaks.toml

  languages-and-platforms:
    name: All languages and platform scaffolds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ShellCheck
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck

      - name: Make CI scripts executable
        run: chmod +x scripts/ci/*.sh

      - name: Language static checks
        env:
          REQUIRE_SHELLCHECK: "1"
        run: ./scripts/ci/validate-languages.sh

      - name: SQL static checks
        run: ./scripts/ci/validate-sql.sh

      - name: Platform scaffolds
        run: ./scripts/ci/validate-platforms.sh

  backend-basic:
    name: Backend TypeScript (basic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Lockfile and engines
        run: |
          node -e '
            const pkg = require("./package.json");
            const lock = require("./package-lock.json");
            if (!pkg.engines || !pkg.engines.node) {
              console.error("package.json is missing engines.node");
              process.exit(1);
            }
            if (!lock.lockfileVersion || lock.lockfileVersion < 2) {
              console.error("package-lock.json is missing a modern lockfileVersion");
              process.exit(1);
            }
          '

      - name: Typecheck
        run: npm run typecheck

  frontend-basic:
    name: Frontend Dart/Flutter (basic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --fatal-warnings

      - name: Pubspec / lock consistency
        run: flutter pub get

  basic-gate:
    name: Basic gate summary
    runs-on: ubuntu-latest
    needs:
      - repo-hygiene
      - languages-and-platforms
      - backend-basic
      - frontend-basic
    if: always() && !cancelled()
    steps:
      - name: Evaluate job results
        run: |
          results=(
            "${{ needs.repo-hygiene.result }}"
            "${{ needs.languages-and-platforms.result }}"
            "${{ needs.backend-basic.result }}"
            "${{ needs.frontend-basic.result }}"
          )
          failed=0
          for r in "${results[@]}"; do
            echo "result=$r"
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              failed=1
            fi
          done
          exit $failed
